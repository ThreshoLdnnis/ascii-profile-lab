name: ASCII Profile Lab

on:
  workflow_dispatch:
  schedule:
    # 08:17 in Asia/Shanghai (UTC+8); GitHub may delay scheduled runs.
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - 'profile.json'
      - 'requirements.txt'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/profile.yml'
  pull_request:
    paths:
      - 'profile.json'
      - 'requirements.txt'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and render an offline demo
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Render a demo without touching the tutorial README
        run: python scripts/generate_profile.py --demo --output-dir "${{ runner.temp }}/ascii-profile-demo"

  profile:
    name: Refresh a real GitHub profile
    needs: validate
    # Scheduled runs intentionally skip validate. A failed/cancelled test run
    # still prevents a write, while the tutorial repository never writes at all.
    if: >-
      ${{ always() &&
          (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
          github.event.repository.name == github.repository_owner &&
          github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Ensure the profile belongs to this repository owner
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = json.loads(Path('profile.json').read_text(encoding='utf-8-sig'))
          username = str(profile.get('username', '')).strip()
          if username.casefold() != os.environ['EXPECTED_OWNER'].casefold():
              raise SystemExit('Edit profile.json: username must match this repository owner before publishing a profile.')
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch accurate public GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py
      - name: Render profile cards and the profile README
        run: python scripts/generate_profile.py --readme README.md
      - name: Commit changed generated files
        shell: bash
        run: |
          git add assets/ README.md
          if git diff --cached --quiet; then
            echo "Profile assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh ASCII profile"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
